name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Use MUSL instead of GNU for 100% statically linked Linux binaries
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: chronx
            asset_name: chronx-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: chronx.exe
            asset_name: chronx-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: chronx
            asset_name: chronx-macos-amd64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          name: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
