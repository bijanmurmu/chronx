[package]
name = "chronx"
version = "1.0.1"
edition = "2021"
description = "Continuous, invisible Undo button for your local file system"
license = "MIT"
repository = "https://github.com/bijanmurmu/chronx"
homepage = "https://github.com/bijanmurmu/chronx"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
notify = "6.1"
similar = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
directories = "5.0"
dialoguer = "0.12.0"
console = "0.16.4"

[profile.release]
opt-level = 3       # Maximize speed
lto = true          # Link Time Optimization (smaller, faster binary)
codegen-units = 1   # Maximize optimization across all crates
strip = true        # Strip symbols to make the binary tiny
panic = "abort"     # Remove panic unwinding code to save space

[dev-dependencies]
tempfile = "3.10"
